name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          path: docs-repo

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: aipartnerup/aipartnerupflow
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: docs-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync documentation from main repository
        working-directory: docs-repo
        env:
          MAIN_REPO_PATH: ../main-repo
        run: |
          # Create docs directory
          mkdir -p docs
          
          # Use Python sync script in CI mode
          python scripts/sync_docs.py --ci
          
          echo "Documentation synced from main repository"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation with versioning
        working-directory: docs-repo
        run: |
          # Make build script executable
          chmod +x scripts/build_with_versioning.sh
          
          # Use shared build script for versioning
          ./scripts/build_with_versioning.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-repo/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

