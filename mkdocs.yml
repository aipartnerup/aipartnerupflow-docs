site_name: aipartnerupflow Documentation
site_description: Task Orchestration and Execution Framework Documentation
site_url: https://flow.aipartnerup.com
repo_url: https://github.com/aipartnerup/aipartnerupflow
repo_name: aipartnerup/aipartnerupflow
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 aipartnerup

# Theme
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.code.select
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - awesome-pages
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true



# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aipartnerup/aipartnerupflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/aipartnerupflow/
  version:
    provider: mike

