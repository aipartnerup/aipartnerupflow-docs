site_name: aipartnerupflow Documentation
site_description: Task Orchestration and Execution Framework Documentation
site_url: https://flow.aipartnerup.com
repo_url: https://github.com/aipartnerup/aipartnerupflow
repo_name: aipartnerup/aipartnerupflow
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 aipartnerup

# Theme
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.code.select
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - awesome-pages
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: '#6366f1'
          primaryTextColor: '#fff'
          primaryBorderColor: '#6366f1'
          lineColor: '#F8B229'
          secondaryColor: '#006100'
          tertiaryColor: '#fff'
  - minify:
      minify_html: true

# Exclude files from documentation
exclude_docs: |
  **/README.md

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true



# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aipartnerup/aipartnerupflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/aipartnerupflow/
  version:
    provider: mike

# Extra CSS and JavaScript
extra_css:
  - assets/mermaid-fullscreen.css

extra_javascript:
  - assets/mermaid-fullscreen.js

