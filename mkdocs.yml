site_name: aipartnerupflow Documentation
site_description: Task Orchestration and Execution Framework Documentation
site_url: https://flow.aipartnerup.com
repo_url: https://github.com/aipartnerup/aipartnerupflow
repo_name: aipartnerup/aipartnerupflow
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 aipartnerup

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.code.select
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Examples: getting-started/examples.md
  - User Guide:
    - CLI Usage: usage/CLI_USAGE.md
  - Architecture:
    - Architecture Overview: architecture/ARCHITECTURE.md
    - Directory Structure: architecture/DIRECTORY_STRUCTURE.md
    - Extension Registry: architecture/EXTENSION_REGISTRY_DESIGN.md
    - Naming Conventions: architecture/NAMING_CONVENTION.md
  - Development:
    - Development Guide: development/DEVELOPMENT.md
    - CLI Design: development/CLI_DESIGN.md
    - Aggregate Results Design: development/AGGREGATE_RESULTS_DESIGN.md
  - Configuration:
    - Table Configuration: configuration/TABLE_CONFIGURATION.md
  - Planning:
    - Implementation Plan: planning/IMPLEMENTATION_PLAN.md
    - CLI Design (Planning): planning/CLI_DESIGN.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aipartnerup/aipartnerupflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/aipartnerupflow/
  version:
    provider: mike

